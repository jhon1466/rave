name: Build Rave iOS (IPA sin firmar)

# Compila Firefox iOS (release/v140) rebrandeado como "Rave" y genera un IPA
# SIN FIRMAR, apto para sideload con AltStore / Sideloadly (no requiere cuenta
# de Apple Developer). Se ejecuta manualmente desde la pestaña Actions.

on:
  workflow_dispatch:
    inputs:
      firefox_ios_ref:
        description: "Rama/tag de mozilla-mobile/firefox-ios a compilar"
        required: true
        default: "release/v140"

permissions:
  contents: write

jobs:
  build:
    # Mismo runner que usa el CI oficial de Mozilla para compilar este release.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout repo Rave (workflow + assets)
        uses: actions/checkout@v4
        with:
          path: rave

      - name: Usar el Xcode default del runner (ya "first-launch" registrado)
        run: |
          # Xcode 16.2 (el que usa el CI de Mozilla) no viene registrado como
          # default en la imagen de GitHub, y "Any iOS Device" falla con un
          # falso "iOS 18.2 is not installed" pase lo que pase. El Xcode
          # default (16.4) sí está inicializado de fábrica en la imagen.
          xcodebuild -version

      - name: Clonar firefox-ios
        run: |
          git clone --branch "${{ github.event.inputs.firefox_ios_ref }}" \
            https://github.com/mozilla-mobile/firefox-ios.git firefox-ios

      - name: Rebranding a "Rave"
        run: |
          cd firefox-ios
          CFG=firefox-ios/Client/Configuration/Fennec.xcconfig
          sed -i '' 's/^MOZ_BUNDLE_DISPLAY_NAME = .*/MOZ_BUNDLE_DISPLAY_NAME = Rave/' "$CFG"
          sed -i '' 's/^MOZ_TODAY_WIDGET_SEARCH_DISPLAY_NAME = .*/MOZ_TODAY_WIDGET_SEARCH_DISPLAY_NAME = Rave - Search/' "$CFG"
          echo "=== Fennec.xcconfig resultante ==="
          grep -E "MOZ_BUNDLE_DISPLAY_NAME|MOZ_TODAY_WIDGET" "$CFG"
          ICONSET=firefox-ios/Client/Assets/AppIcons.xcassets/AppIcon.appiconset
          cp ../rave/ios-assets/rave-icon-1024.png "$ICONSET/appstore.png"
          cp ../rave/ios-assets/rave-icon-1024.png "$ICONSET/appstore-dark.png"
          cp ../rave/ios-assets/rave-icon-1024.png "$ICONSET/appstore-tinted.png"
          echo "=== app icon reemplazado ==="

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Checkout auxiliar (nimbus focus-ios + shavar-prod-lists)
        run: |
          cd firefox-ios
          sh ./checkout.sh || true

      - name: Bootstrap firefox-ios
        run: |
          cd firefox-ios
          sh ./bootstrap.sh
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolver dependencias de Swift Package Manager
        run: |
          cd firefox-ios
          xcodebuild -resolvePackageDependencies -project firefox-ios/Client.xcodeproj

      - name: Listar schemes disponibles (diagnóstico)
        run: |
          cd firefox-ios
          xcodebuild -project firefox-ios/Client.xcodeproj -list

      - name: Listar SDKs y destinos válidos (diagnóstico)
        run: |
          cd firefox-ios
          echo "=== SDKs instalados ==="
          xcodebuild -showsdks
          echo "=== Destinos válidos para el scheme Fennec ==="
          xcodebuild -project firefox-ios/Client.xcodeproj -scheme Fennec -showdestinations || true

      - name: Compilar (Fennec, sin firmar, dispositivo arm64)
        run: |
          cd firefox-ios
          xcodebuild build \
            -project firefox-ios/Client.xcodeproj \
            -scheme Fennec \
            -configuration Fennec \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_VERSION=5 \
            2>&1 | tee xcodebuild.log | xcpretty || true
          XCODEBUILD_STATUS=${PIPESTATUS[0]}
          if [ "$XCODEBUILD_STATUS" -ne 0 ]; then
            echo "=== BUILD FAILED (status $XCODEBUILD_STATUS) — últimas 150 líneas: ==="
            tail -150 xcodebuild.log
            exit 1
          fi
          APP=$(find build/Build/Products -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: build reportó éxito pero no se encontró el .app"
            exit 1
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "App compilada: $APP"
          du -sh "$APP"

      - name: Empaquetar IPA sin firmar
        run: |
          cd firefox-ios
          rm -rf Payload Rave-iOS.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr ../Rave-140-ios-unsigned.ipa Payload
          cd ..
          ls -la Rave-140-ios-unsigned.ipa

      - name: Subir IPA como artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rave-iOS-unsigned-IPA
          path: Rave-140-ios-unsigned.ipa
          retention-days: 30

      - name: Adjuntar IPA al release v140.1.0
        run: |
          gh release upload v140.1.0 Rave-140-ios-unsigned.ipa \
            --repo ${{ github.repository }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
